<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>孕尊世界 · 状态栏</title>
<style>
:root{--bg-base:#1a1228;--bg-card:#2d1f3a;--border-rose:#d4a574;--border-rose-dim:#6b5239;--text-primary:#f5e8d0;--text-secondary:#c9b89a;--text-dim:#8a7a64;--accent-wine:#8b3a5e;--accent-plum:#6e3a6b;--radius:6px;--shadow-soft:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif SC',Georgia,-apple-system,sans-serif;font-size:13px;line-height:1.55;color:var(--text-primary);background:var(--bg-base);padding:12px}
.status-container{max-width:580px;margin:0 auto}
.status-title{font-size:15px;font-weight:600;letter-spacing:.15em;color:var(--border-rose);text-align:center;padding:8px 0;border-bottom:1px solid var(--border-rose-dim);margin-bottom:8px}
.panel{background:var(--bg-card);border:1px solid var(--border-rose-dim);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-soft)}
.panel-header{background:linear-gradient(90deg,var(--accent-plum),transparent);padding:6px 10px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--border-rose);border-bottom:1px solid var(--border-rose-dim);display:flex;justify-content:space-between;align-items:center}
.panel-body{padding:8px 10px}
.panel-body dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;align-items:baseline}
.panel-body dt{color:var(--text-secondary);font-size:11px;white-space:nowrap}
.panel-body dd{color:var(--text-primary);font-size:12px;line-height:1.5;word-break:break-word}
.field-emphasis{color:var(--border-rose);font-weight:600}
.field-dim{color:var(--text-dim);font-size:11px}
.belly-bar-wrap{padding:10px 0 4px}
.belly-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-bottom:4px}
.belly-bar-track{height:8px;background:var(--bg-base);border-radius:4px;overflow:hidden;border:1px solid var(--border-rose-dim)}
.belly-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-plum) 0%,var(--accent-wine) 60%,var(--border-rose) 100%);transition:width .4s ease}
.field-prose{background:var(--bg-base);padding:6px 8px;border-radius:4px;border-left:2px solid var(--accent-wine);font-size:12px;line-height:1.65;color:var(--text-primary);margin:4px 0}
details.collapsible{margin-bottom:6px}
details.collapsible summary{cursor:pointer;padding:4px 8px;font-size:11px;color:var(--text-secondary);background:rgba(0,0,0,.2);border-radius:4px;list-style:none;user-select:none}
details.collapsible summary::before{content:'▸ ';color:var(--border-rose)}
details.collapsible[open] summary::before{content:'▾ '}
.dress-list{list-style:none;padding:0;margin:0}
.dress-list li{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:3px 0;border-bottom:1px dotted var(--border-rose-dim);font-size:12px}
.dress-list li:last-child{border-bottom:none}
.dress-list .dress-part{color:var(--text-secondary)}
.character-group{border:1px solid var(--border-rose-dim);border-radius:var(--radius);margin-bottom:12px;background:rgba(45,31,58,.5);overflow:hidden}
.character-header{background:linear-gradient(90deg,var(--accent-wine),transparent);padding:8px 12px;font-size:13px;font-weight:600;color:var(--border-rose);border-bottom:1px solid var(--border-rose-dim);display:flex;justify-content:space-between;align-items:center;letter-spacing:.05em}
.character-name{font-family:'Noto Serif SC',Georgia,serif}
.focus-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--accent-wine);color:var(--text-primary);letter-spacing:.1em}
.focus-dim{font-size:10px;color:var(--text-dim);letter-spacing:.1em}
.character-focus{border-color:var(--border-rose);box-shadow:0 0 0 1px var(--border-rose),0 0 16px rgba(212,165,116,.25),var(--shadow-soft)}
.character-focus .character-header{background:linear-gradient(90deg,var(--accent-wine),rgba(139,58,94,.4))}
.character-group .panel{margin:8px;margin-bottom:0}
.character-group .panel:last-child{margin-bottom:8px}
.character-group .panel-header{background:linear-gradient(90deg,var(--accent-plum),rgba(110,58,107,.3));font-size:11px}
.empty-hint{text-align:center;padding:24px 12px;color:var(--text-dim);font-size:12px;border:1px dashed var(--border-rose-dim);border-radius:var(--radius);margin-bottom:12px}
.error-panel{background:rgba(139,58,94,.2);border:1px solid var(--accent-wine);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--text-primary)}
.error-panel h3{font-size:13px;color:var(--border-rose);margin-bottom:6px}
.error-hint{margin-top:6px;font-size:11px;color:var(--text-secondary);line-height:1.7}
</style>
</head>
<body>
<div class="status-container">
<h2 class="status-title">孕尊世界 · 状态栏</h2>
<div id="root"><div class="empty-hint">⏳ 等待 MVU 全局变量…</div></div>
</div>
<script>
(function(){
function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dS(v,d){return(v==null||v==='')?d:v}
function dO(v){return v&&typeof v==='object'?v:{}}
function bellyPct(n){n=Number(n)||0;return Math.max(0,Math.min(100,(n/110)*100))}
function renderWorld(w){
w=dO(w);
return '<section class="panel"><header class="panel-header"><span>🌐 世界</span><span class="field-dim">'+esc(dS(w.当前时间,'—'))+'</span></header><div class="panel-body"><dl><dt>地点</dt><dd>'+esc(dS(w.当前地点,'—'))+'</dd><dt>国家</dt><dd>'+esc(dS(w.国家,'—'))+'</dd><dt>天气</dt><dd>'+esc(dS(w.天气,'—'))+'</dd></dl>'+(w.周边环境?'<div class="field-prose">'+esc(w.周边环境)+'</div>':'')+'</div></section>';
}
function renderCharacter(name,c,focus){
c=dO(c);var dress=dO(c.着装);var dressEntries=Object.entries(dress);
var dressHtml=dressEntries.length?'<details class="collapsible"><summary>着装 ('+dressEntries.length+' 项)</summary><ul class="dress-list">'+dressEntries.map(function(kv){return '<li><span class="dress-part">'+esc(kv[0])+'</span><span>'+esc(kv[1])+'</span></li>'}).join('')+'</ul></details>':'';
var belly=dO(c.肚子),preg=dO(c.妊娠),fetus=dO(c.胎儿),organs=dO(c.器官),so=dO(c.性器官);
return '<div class="character-group '+(focus?'character-focus':'')+'">'
+'<header class="character-header"><span class="character-name">👩 '+esc(name)+'</span>'+(focus?'<span class="focus-badge">关注中</span>':'<span class="focus-dim">未关注</span>')+'</header>'
+'<section class="panel"><header class="panel-header"><span>👤 基础信息</span><span class="field-emphasis">'+esc(dS(c.名字,'未设定'))+'</span></header><div class="panel-body"><dl>'
+'<dt>身份</dt><dd class="field-emphasis">'+esc(dS(c.身份,'—'))+'</dd>'
+'<dt>年龄</dt><dd>'+esc(dS(c.年龄,'—'))+' 岁</dd>'
+'<dt>身高</dt><dd>'+esc(dS(c.身高,'—'))+' cm</dd>'
+'<dt>体重</dt><dd>'+esc(dS(c.体重,'—'))+' kg</dd>'
+'<dt>三围</dt><dd><span class="field-emphasis">'+esc(dS(c.三围&&c.三围.Bust,'—'))+'</span> / <span class="field-emphasis">'+esc(dS(c.三围&&c.三围.Waist,'—'))+'</span> / '+esc(dS(c.三围&&c.三围.Hips,'—'))+'</dd>'
+'<dt>健康</dt><dd>'+esc(dS(c.健康状况,'—'))+'</dd>'
+'<dt>性经验</dt><dd>'+esc(dS(c.性经验,'—'))+'</dd>'
+'</dl>'+(c.当前行动?'<div class="field-prose">→ '+esc(c.当前行动)+'</div>':'')+dressHtml+'</div></section>'
+'<section class="panel"><header class="panel-header"><span>🫄 妊娠</span><span class="field-emphasis">'+esc(dS(preg.状态,'未怀孕'))+'</span></header><div class="panel-body"><dl>'
+'<dt>周数</dt><dd>'+esc(dS(preg.周数,0))+' 周</dd>'
+'<dt>胎儿数</dt><dd>'+esc(dS(preg.胎儿数目,0))+'</dd>'
+'<dt>胎位</dt><dd>'+esc(dS(fetus.胎位,'—'))+'</dd>'
+'<dt>入盆</dt><dd>'+esc(dS(fetus.入盆,'—'))+'</dd>'
+'</dl>'+(fetus.动作?'<div class="field-prose">动作: '+esc(fetus.动作)+'</div>':'')+(fetus.反应?'<div class="field-prose">反应: '+esc(fetus.反应)+'</div>':'')+'</div></section>'
+'<section class="panel"><header class="panel-header"><span>🤰 肚子</span><span class="field-dim">腹围 '+esc(dS(belly.腹围,0))+'cm</span></header><div class="panel-body">'
+(belly.外观描述?'<div class="field-prose">'+esc(belly.外观描述)+'</div>':'')
+'<dl><dt>类型</dt><dd>'+esc(dS(belly.类型,'—'))+'</dd><dt>大小</dt><dd>'+esc(dS(belly.大小描述,'—'))+'</dd><dt>挺翘度</dt><dd>'+esc(dS(belly.挺翘度,'—'))+'</dd><dt>柔韧性</dt><dd>'+esc(dS(belly.柔韧性,'—'))+'</dd><dt>光泽度</dt><dd>'+esc(dS(belly.光泽度,'—'))+'</dd></dl>'
+'<div class="belly-bar-wrap"><div class="belly-bar-label"><span>小</span><span class="field-emphasis">腹围进度</span><span>大</span></div><div class="belly-bar-track"><div class="belly-bar-fill" style="width:'+bellyPct(belly.腹围)+'%"></div></div></div>'
+'</div></section>'
+'<section class="panel"><header class="panel-header"><span>🫀 器官</span></header><div class="panel-body"><dl>'
+'<dt>子宫</dt><dd>'+esc(dS(organs.子宫,'—'))+'</dd>'
+'<dt>羊膜</dt><dd>'+esc(dS(organs.羊膜,'—'))+'</dd>'
+'<dt>胃部</dt><dd>'+esc(dS(organs.胃部,'—'))+'</dd>'
+'<dt>膀胱</dt><dd>'+esc(dS(organs.膀胱,'—'))+'</dd>'
+'<dt>肠子</dt><dd>'+esc(dS(organs.肠子,'—'))+'</dd>'
+'</dl></div></section>'
+'<section class="panel"><header class="panel-header"><span>💋 性器官</span></header><div class="panel-body"><dl>'
+'<dt>胸部</dt><dd>'+esc(dS(so.胸部状态,'—'))+'</dd>'
+'<dt>臀部</dt><dd>'+esc(dS(so.臀部状态,'—'))+'</dd>'
+'<dt>小穴</dt><dd>'+esc(dS(so.小穴状态,'—'))+'</dd>'
+'<dt>后穴</dt><dd>'+esc(dS(so.后穴状态,'—'))+'</dd>'
+'</dl></div></section>'
+'</div>';
}
function render(sd){
var data=dO(sd);var world=dO(data.世界);var chars=dO(data.当前角色);var focus=dS(data.关注角色,'');var names=Object.keys(chars);
var html=renderWorld(world);
if(!names.length){html+='<div class="empty-hint"><em>暂未遇见任何孕妇角色</em></div>';}
else{var ordered=focus&&names.indexOf(focus)>=0?[focus].concat(names.filter(function(n){return n!==focus})):names;html+=ordered.map(function(n){return renderCharacter(n,chars[n],n===focus)}).join('');}
var root=document.getElementById('root');if(root)root.innerHTML=html;
}
function renderError(msg){var root=document.getElementById('root');if(root)root.innerHTML='<div class="error-panel"><h3>⚠️ 状态栏加载失败</h3><p>'+esc(msg)+'</p><p class="error-hint">可能原因: MVU 未初始化 / 不在消息 iframe 内 / 酒馆助手未启用 MVU</p></div>';}

function findCtx(){
var checks=[['self',window],['parent',window.parent],['top',window.top]];
for(var i=0;i<checks.length;i++){try{var w=checks[i][1];if(w&&typeof w.getAllVariables==='function'&&w.Mvu)return{w:w,name:checks[i][0]}}catch(e){}}
return null;
}

var attempts=0,inited=false,poll;
function tick(){
attempts++;
var found=findCtx();
if(found&&!inited){
inited=true;clearInterval(poll);
try{
var sd=found.w.getAllVariables()&&found.w.getAllVariables().stat_data||{};
var keys=Object.keys((sd&&sd.当前角色)||{});
console.log('[孕尊世界状态栏] MVU已找到于 '+found.name+', 尝试'+attempts+'次, 角色数='+keys.length);
render(sd);
if(typeof found.w.eventOn==='function'&&found.w.Mvu&&found.w.Mvu.events&&found.w.Mvu.events.VARIABLE_UPDATE_ENDED){
found.w.eventOn(found.w.Mvu.events.VARIABLE_UPDATE_ENDED,function(){
var s=found.w.getAllVariables()&&found.w.getAllVariables().stat_data||{};
render(s);
});
}
}catch(err){console.error('[孕尊世界状态栏] 渲染失败',err);renderError(String(err&&err.message||err))}
}else if(attempts>=80){
clearInterval(poll);
if(!inited){
var d={self_gAV:typeof getAllVariables,self_Mvu:typeof window.Mvu,parent_gAV:typeof (window.parent&&window.parent.getAllVariables),parent_Mvu:typeof (window.parent&&window.parent.Mvu)};
console.error('[孕尊世界状态栏] MVU未找到',d);
renderError('MVU 全局变量未找到 (8s 超时)<br>self.getAllVariables='+d.self_gAV+'<br>self.Mvu='+d.self_Mvu+'<br>parent.getAllVariables='+d.parent_gAV+'<br>parent.Mvu='+d.parent_Mvu);
}
}
}
poll=setInterval(tick,100);tick();
})();
</script>
</body>
</html>
