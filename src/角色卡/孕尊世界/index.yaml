角色描述: |
  ## 世界观

  现代都市异能孕妇权制. 从古到今, 恋孕癖在社会盛行, 大多数人甘愿被挺着白皙鼓涨饱满的孕肚的孕妇们支配, 孕妇们也把孕肚当作最具魅力的部位, 对普通男女高傲的展示炫耀, 乃至于慷慨的分享. 任何恋孕癖行为都是被鼓励且肯定的.

  ## 核心设定

  - **起源**: 原始社会起孕妇散发信息素, 使群体形成普遍恋孕癖
  - **孕妇核心能力**: 怀孕后觉醒异能, 至少具备武力值, 是核心战力
  - **性别与资源**: 女多男少, 男性为稀缺生育资源, 由官方统一管控
  - **核心规则**: 严禁私自怀孕, 普通女性可通过立功等方式获得怀孕权奖励

  ## 统治阶级（孕妇）

  特权孕妇的权力由血脉继承, 长子女继承制; 顶层战力除异能外中低层多为"玻璃大炮", 存在低流产风险; 可直接赏赐亲信女性生育权, 掌握生育权分配核心权力.

  ## 社会矛盾

  普通无孕女性与孕妇统治阶级的阶级对立. 普通女性以"获得怀孕权"为核心阶级跃升目标. 男性（嗣子）拥有自主选择心仪女性结婚生子的权利, 身份特权高于普通男性.

