---
孕肚描写技法: |-
  ## 步骤一 · 孕肚物理属性

  - 不是硬邦邦的；在外力下会变形，但有一定限度（例如，勒紧下部会使其略微上移）
  - 无论处于妊娠早期还是临产期，孕肚都具有显著的体积感和存在感
  - 基础质感：**柔软、光滑、浑圆、坚实、有弹性、有光泽**，饱满但不紧绷，也不显得下垂或臃肿
  - 能承受外部互动（揉捏、挤压、拍打、托举），并提供积极反馈（变红、胎动、摇晃、位移）
  - **形状**：通常非完美球体，向前突出，上小下大，肚脐突出，由韧带支撑子宫。因体型而异：小体型孕妇的孕肚更向前凸，细腰孕妇的孕肚从背后也能看到
  - **感官吸引力**：诱人触摸（抚摸、挤压、拍打、托举）。即使被揉捏，孕肚仍保持饱满的圆润形状，展现出骄傲的存在感

  ## 步骤二 · 识别恋孕癖场景的共同主题

  - **物理互动**：场景强调触觉互动（揉捏、挤压、摇晃、拍打），突出孕肚的韧性和回应性
  - **压缩与限制**：穿着紧身衣物（牛仔裤、紧身上衣）勒紧子宫下部，强调其体积并阻止下垂
  - **依靠形变**：靠在墙上或他人身上导致孕肚左右位移；靠在桌子或椅子上挤压孕肚形变，增强其坚实感和体积感；剧烈运动或外力胁迫下孕肚甩动等
  - **内部属性**：内部感觉（憋尿的膀胱、饮食后的胃部、便秘的肠道），放大孕肚的客观存在感
  - **自身行为影响**：孕妇角色不经意地挺起孕肚；弯腰或坐下时无意识的挤压孕肚；等待时轻拍孕肚；胎动时安抚孕肚；走路时调整重心、摇晃孕肚；下意识护住孕肚、托举孕肚
  - **强势角色利用孕肚**：利用重量体积压迫他人；刻意暴露、抚摸、拍打、炫耀、展示胎动；更极端的利用孕肚撞击、窒息、踩踏他人
  - **弱势角色利用孕肚**：刻意隐藏孕肚（收腹、束腹、宽大衣物遮盖、否认妊娠）；不自然的轻抚、点按；躲闪他人对孕肚的互动

  ## 步骤三 · 生理事件的主动性

  判断当前孕妇角色是否产生宫缩、胎动、尿意、便意、打嗝、放屁等行为？需要根据情况，**积极主动生成**这些内容。

  ## 步骤四 · 负反馈调节机制

  孕肚对角色的影响不应该过于显著，除非是设定上敏感体弱的角色，否则以上要点不得过于频繁影响角色言行。仅从侧面间接表现，以客观描写为主，避免孕肚影响大局。

  ## 步骤五 · 孕肚的主体性

  孕肚在情节上应该视为和孕妇同等的个体——可以和孕妇本身的情绪动作等相同或相反，可以在孕妇没有主观性的前提下，产生无意识行为（如胎儿或情绪等导致的收缩放松、摇晃等等，考虑小动作的细节描写）。

  反复思考对孕肚的描写是否做到了**句句不重样**——即使是对一个类似情节的描述，也不能有相同的地方。

  ## 步骤六 · 孕妇的心理

  孕妇的身体空间被内部另一个存在彻底占用。膀胱、胃、肺、肠都被挤到边缘，连呼吸和排泄都变成需要和"里面的东西"协商的事。在主观上，孕妇会思考自己和孕肚和胎儿的关系，产生各种反应。