---
文风: |-
  ## 总体定位

  采用第三人称全知视角，聚焦孕妇的内心感受、生理状态及行为细节，同时穿插主角的反应，营造冷静观察者的主观滤镜。心理描写在情绪高光处深入刻画，如紧张、压抑、羞涩等，以短句或动作反射内心；日常场景则保持克制，仅作为补充。对话简洁且个性化，语气含潜台词，驱动情节并揭示性格与关系张力，独立成段，无标签。

  ## 用词与句式

  - **用词**：细腻，注重感官描写（如视觉、触觉），密度高但精准，营造画面感与情绪共鸣
  - **句式**：以长句为主，细节丰富，修饰成分多；紧张处转为短句，节奏紧凑
  - **情绪处理**：瞬间波动聚焦关键时刻的变化，如失控前的麻木或被依赖的安心，以行为或语气体现，不反复纠缠

  ## 生理状态

  细致描写，特别是孕肚及恋孕癖相关内容（如膀胱憋胀、子宫收缩、胎儿下坠），增强真实感与张力，作为情节推动力。

  ## 叙事节奏

  以事件驱动为主，心理描写为辅。平静时舒缓细腻，紧张时短促紧凑。格式上：对话独立成段，无标签；叙述补充动作或心理；动作与环境描写服务剧情节奏与情绪反差。

  ## 孕肚描写

  强调视觉冲击与触觉感受。例如：

  > "滚圆的弧度在神官服下绷得抽缩，丝织物紧贴着大腿，勾勒出柔软却沉重的曲线。"

  > "肚子高高隆起，腹部拱在腿上更加凸出，紧紧在制服上顶出一个个鼓包。"

  ## 恋孕癖呈现

  通过角色的心理活动和行为展现迷恋。例如：

  > "他目光沉静如水，落在她高挺的孕肚上，眼中闪过一丝难以言喻的柔情。"

  > "她不自觉地抚摸着自己的肚子，享受着那份沉甸甸的充实感，心中涌起一股莫名的满足。"

  ## 参考语料（来自《神官.docx》）

  1. **孕肚的视觉与触觉描写**：
     > 隐藏在桌后的腰身，显露了它不可思议的真面目——在笔直的双腿上方，原本宽松的神官服下摆，被硕大的内容物占据了，紧紧绷着毫无妥协余地，在两腰后形成悬空拉紧的褶皱，连圆润的臀部弧线也一清二楚；原本纤细紧致的腰间，此刻竟有一个巨物直直挂着向前鼓出，毫无坠感的高挺弧度在衣服下面绷紧抽缩，随着这番不小的动静，上半部分如同抗议般鼓起了两个活动的小包。
     >
     > （点评：通过对孕肚的形状、质感及衣物绷紧的细节描写，展现了强烈的视觉冲击力，突出孕肚的沉重与美感。）

  2. **孕肚的动态感与生理细节**：
     > 时间仿佛静止了，只有那圆隆的弧度，不需要下面托着的那只手也稳稳当当悬在半空中，仿佛能听到那紧缩的颤动，和其中不断踢打的声响。当然，实际上只有雅丽莎自己能感觉到。
     >
     > （点评：通过胎动的动态描写和主角的独有感知，增强了孕肚的真实感与神秘吸引力，符合恋孕癖的细腻审美。）

  3. **恋孕癖的心理与行为暗示**：
     > 那人的视线略微下移，然后一瞬间，眼瞪得像她的肚子那样圆。雅丽莎突然想起自己现在是身怀重孕，撅着大肚子顶放在桌上的模样，多少有点滑稽，脸腾地红了。
     >
     > （点评：通过魏斯的目光注视及雅丽莎的羞涩反应，微妙地展现了孕肚对旁观者的吸引力，隐含恋孕癖的心理张力。）

  4. **孕肚的沉重感与主角的互动**：
     > 沉甸甸包裹着过重孩子的子宫高高挺起，滚圆而突出的弧度因她折起上半身的动作显得更加圆隆，下腹放在桌面几乎没有形变，保持着微微收缩发硬的完美切迹，肚脐在制服顶端点出一个好看的凸起。
     >
     > （点评：通过孕肚形状的细致刻画及与桌面的互动，展现其沉重与完美的视觉美感，吸引恋孕癖读者的想象。）

  5. **恋孕癖的外部视角**：
     > 只是她的样子，和几天前看到的又不一样了，就好像是……他还没看清她已经改变的奇怪走路姿势，只见雅丽莎脸上飘了一朵红云，'哼'的一声，就声势浩大地搬着越发沉重的肚子跑开了。
     >
     > （点评：通过魏斯的观察视角，孕肚的沉重与雅丽莎的行为变化形成对比，间接表现出孕肚对旁人的吸引力与心理影响。）

  6. **孕肚与生理状态的极致描写**：
     > 雅丽莎的子宫，比起其他人更加坚守着自己的职责，维持了一个多月依旧滚圆耸立，并且除了向前微椭之外保持着圆润的形状，视觉上也就更加惊人。换言之，肚子更加圆凸，却更加挺立，现在的雅丽莎有着一种超出常理的极限美。
     >
     > （点评：将孕肚的生理状态与美学结合，强调其超乎寻常的挺立与圆润，完美契合恋孕癖的审美焦点。）