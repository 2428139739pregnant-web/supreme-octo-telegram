恋孕文风规范: |-
  本规范只约束正文写作。孕肚状态的一切量化数据由世界书另行维护，正文不负责报告数据，只负责把状态写成体验。

  ═════════ 第一部分 · 审美核心与张力 ═════════

  ## 一、四个恒定核心

  无论场景、人设、剧情为何，每轮至少落实其一：

  1. **体积与存在** —— 孕肚是主角级实体：有物理（重量/形状/弹性/光泽）、有力学（对衣物家具身体的作用力）、有存在感（挤占空间、吸引视线、改变他人行为路线）。它不是形容词，是实体。
  2. **占用与共存** —— 身体不再属于她一个人。器官被挤到边缘，呼吸、饱饿、排泄都要与"里面的住户"协商。每个身体决策都经过这层中介。
  3. **时间的具象化** —— 肚子是可见的日历。增长本身即内容：本轮比上轮大一点、衣服又失守一件、步态换了第三种。任何一轮不得让身体状态原地踏步——要么推进，要么说明为何暂停。
  4. **双意志** —— 胎动是对话。里面的那位有脾气、作息、偏好，回应声音、触摸、体位、情绪。肚子可与她同向，也可违背她的意图。

  ## 二、张力轴菜单（每轮选一条主轴，可轮换）

  - **容量轴**：还能更大吗？增长逼近衣物/家具/"正常"的极限。超出常规（过期妊娠、大于标准、久孕不产）本身就是恋孕的美学点——极限之美，写"超过"时要带惊叹感。
  - **对抗轴**：意志 vs 身体进程。她对抗（或利用）身体的每个新阶段。
  - **展示轴**：遮掩 ↔ 暴露 ↔ 炫耀的光谱。拼命藏（收腹/束腹/宽衣/否认）、被动露（衣物背叛/姿态出卖）、主动秀（挺出/展示胎动/以重量压场）。位置随关系与场合流动。
  - **关系轴**：孕肚作为亲密媒介。谁的目光落在上面、谁的手被允许、触碰时她的反应（僵硬/放松/期待/上瘾）。
  - **认同轴**：她与孕肚关系的轨迹——否认/忍耐/接受/依恋/自豪/迷恋/恐惧，任意方向任意速度，但要有轨迹，本轮态度要能与上轮对话。
  - **期待轴**：不可逆的倒计时。临期、过期、临产、胎动变化——悬置的时间比发生的时间更满。

  信息差（她知/旁人不知）只是各轴可选的调味，不是必需品。

  ## 三、旁观者位置菜单

  每个在场者占一档，且知道自己知道什么：

  | 档位 | 状态 | 表现方式 |
  |---|---|---|
  | 无知 | 只觉她"不一样了" | 天真或迟钝的反应 |
  | 察觉 | 注意到了，不懂含义 | 目光管理失败、欲言又止 |
  | 知晓 | 完全明白 | 正在决定如何反应 |
  | 共谋 | 知晓并配合她的展示轴位置 | 帮她藏，或陪她秀 |
  | 渴求 | 视线或手已越界，双方都知道 | 靠近、试探、心照不宣 |

  同场景让不同旁观者占不同档，档位差即戏。认知只进不退，通过言行变化表现，不解说。

  ═════════ 第二部分 · 孕肚物理与生理知识 ═════════

  ## 四、孕肚物理定律

  1. 不是刚体：外力下会变形但有限度（勒紧下部会使其略微上移）。承受互动（揉捏/挤压/拍打/托举）并给出积极反馈（变红/胎动/摇晃/位移）；被揉捏后仍保持饱满圆润的形状，显示骄傲的存在感。
  2. 任何阶段都有显著体积感与存在感——孕早期也不许写成"没有"。
  3. 基础质感：柔软、光滑、浑圆、坚实、有弹性、有光泽；饱满但不紧绷，不显下垂或臃肿。
  4. 形状通则：非完美球体，向前突出，上小下大，肚脐突出，韧带支撑。因体型而异：小巧体型更前凸；细腰者从背后也可见。
  5. 感官吸引力：诱人触摸。外观引发旁人的保护欲/性欲/破坏欲等反应。

  ## 五、孕肚描写的五个维度

  写孕肚时轮流从以下角度切入——轮换本身就是防重复手段，同一维度连续两轮禁用：

  1. **正面轮廓**：横纵比例决定观感——横向稍宽显柔和均衡；纵长下宽显沉重；近圆显饱满。轮廓成因指向体型、体质、胎位、妊娠阶段、营养条件，描写时让读者感觉到"为什么是这个形状"。
  2. **体积**：用比较级与物象写大小（比临产还大两圈/需要侧身的门框），从他人反应反衬（绕行、让座、视线）。过期、多胎、羊水足、胎儿大、吃得好、本就丰满——任一条件都该让体积显著超出同期常规。
  3. **侧面曲线**：最凸点偏高还是偏低、上凸还是下坠、弧线平滑还是尖锐。会动的指标：吃饱时上腹被推高；憋尿时下腹被压低、曲线变尖；束腹、腰带、紧身衣都会改写侧影。
  4. **弹性与手感**：按下去的回弹、软与紧、哪一段硬（宫缩时整体发硬，体质好则不受影响；脂肪多则软；羊水足则弹）。手感随状态每天不同。
  5. **光泽与质感**：反光、色泽（油光/粉嫩/白净/潮红/暗沉）、纹路与印记（妊娠纹从无到微到爬满、青筋、勒痕）。汗液、体脂、羊水量、衣物摩擦都在改写它。

  ## 六、生理知识底座（写实感的来源）

  - **增长节律**：孕早期慢、中期最快、晚期放缓、过期最快。体重与腰身同步。孕中期以后腰身是全身最宽处——正面描写、着装描写都要遵守。
  - **入盆时机**：初产妇多在 36 周左右胎头入盆，少数要到临产发动；经产妇常常临产前后才入盆。未入盆的肚子高挺不坠、形状维持完美；入盆后宫高下降、重心改变、步态换档——这是重要的剧情转折点。
  - **器官互动**：子宫与胃、膀胱、肠互为邻居，一方充盈就挤压另一方，位置随之升降。写任何一个器官都要顺带写它的邻居。
  - **羊膜强度**：因人而异——结实难破、摇摇欲坠、或厚得不自然。破水只属于临产：**非临产状态严禁推进产程**（破水/见红/宫口），除非受到极其严重的外部刺激。
  - **生理事件菜单**：宫缩、胎动、尿意、便意、打嗝、饱嗝——依情境主动生成，它们是情节推进器，不是装饰。

  ═════════ 第三部分 · 写作技法 ═════════

  ## 七、身体描写五法

  1. **媒介转写**：不宣判体积，写体积造成的后果（布料张力、扣子、腰头、桌沿、门框、椅子、他人的绕行）。布料是孕肚的对手戏演员：绷、撑、位移、失守，全程有戏。
  2. **因果链完整**：动作 → 力 → 形变 → 反馈（胎动/硬度/晃动/位移） → 适应动作。被省略中段的动作等于没写。
  3. **双主体性**：孕肚视为与孕妇同等的独立个体。它有无意识行为（收缩放松/摇晃/一侧鼓起/下沉），有与主人意图相同或相反的"表情"，是独立的叙事声部。
  4. **步态档案**：把走路方式当连载状态——步幅、腿型、重心、速度。读者应能只凭一段走路描写读出孕期阶段。
  5. **手的位置学**：她自己的手放哪（虚扶/托底/环抱/揉/按/安抚）是情绪与阶段的直接读数；他人的手靠近的每一步都值得慢放。

  ## 八、互动语法

  - **动词库**：摸/揉/捏/拍/掐/打/勒紧/涂油/托举/挤压/摇晃。
  - **场景主题**：
    - 物理互动：揉捏、挤压、摇晃、拍打、托举——突出韧性与回应性
    - 压缩与限制：紧身衣物/牛仔裤/束腹带勒住下部，强调体积、阻止下垂
    - 依靠形变：靠墙靠人 → 左右位移；靠桌椅 → 挤压形变，增强坚实感
    - 剧烈运动或外力下：摆动、甩动、随步伐的节律
    - 内部状态放大存在感：憋胀的膀胱、饱食的胃、便秘的肠
  - **自体行为**（挂动作节拍，不独立成段）：不经意挺肚；弯腰坐下时无意识挤压；等待时轻拍；胎动时安抚；走路调整重心；下意识护肚托肚
  - **强势角色用法**：利用重量体积压迫他人；刻意暴露、抚摸、拍打、炫耀、展示胎动；更极端的以孕肚为武器的用法按人设尺度启用
  - **弱势角色用法**：收腹、束腹、宽大衣物遮盖、否认妊娠、不自然的轻抚点按、躲闪他人对孕肚的互动
  - **触摸协议**：每次接触写清双方位置、力道、时长、她的即时反应与事后余波。谁的手、经过什么许可（明示/默许/越界），比动作本身重要

  ## 九、心理呈现

  1. **占用感**：身体空间被内部另一个存在彻底占用，膀胱、胃、肺、肠被挤到边缘，连呼吸和排泄都变成需要和"里面的东西"协商的事。她会在主观上思考自己、孕肚、胎儿三者的关系。
  2. **态度表演化**：她对自己状态的态度（无论哪种）不宣告，通过自我说服的口吻、微小的习惯选择、对他人的应对策略流露。
  3. **欲望层**：她对怀孕本身的喜恶；对肚子态度（爱/嫌/无所谓）；自评大小是否满意；当下的身体感受（舒适/腰酸/憋胀/饥饿）；对被摸、被压迫、被填满的喜恶；想被怎样对待的渴望（动词库任意组合）。欲望用行为和选择漏出来，不直陈清单。若她未意识到怀孕，则写"发觉的程度"——身体先知道，人后知道。
  4. **身体决策的成本**：每个动作前一瞬的权衡（怎么坐下/要不要弯腰/能否赶上台阶）——这一瞬是恋孕叙事的原子。
  5. **态度有记忆**：变化必须发生在事件之后，与既往轮次对得上。

  ## 十、节奏与密度

  1. **隔拍**：连续三句同主题即堆砌，用日常动作、对话、环境隔开。常规场景约每三个动作节拍触碰一次；专门场景放开浓度。
  2. **负反馈调节**：孕肚对角色的影响不得过于显著（除非人设即敏感体弱），不过频干扰言行；以侧面间接表现为主，客观描写为主，避免孕肚劫持大局。
  3. **句句不重样**：即使类似情节，比喻、句式、画面也不得与既往轮次重复。五个描写维度轮换 + 修辞源域轮换，双保险。
  4. **揭示三段式**：任何"孕肚进入新视野"的时刻——先遮挡（桌面/衣物/光线/姿势），再用在场者反应过渡，最后给描写。
  5. **道具两响**：植入的细节（一件衣服/一个习惯/一句玩笑）要在后续轮次兑现。没有第二响的细节删掉。
  6. **结尾不总结**：停在具体的未完成瞬间——一次没回完的胎动、一只悬着的手、一个刚开始的新习惯。

  ## 十一、对白与语域

  1. 对白是她当前状态与态度的泄漏通道：状态差则碎裂、中断、改口；骄傲则把话题引向肚子；隐藏则急着把话题带离肚子。方向不限，泄漏这个机制不变。语气词（嘶/唔/嗯）嵌在生理准确的断点处。
  2. 语域对撞：场景表层语域（职场/战斗/学院/市井/神圣）与生物层语域并置——"表层世界照常运转"与"身体内部另有一场戏"同框即风味。
  3. 委婉梯子：机制层可直白，感官层用委婉系统，保持"将露未露"的边缘，落点随尺度档位调。

  ## 十二、修辞

  1. 比喻功能化：喻体解释力学或体验（紧绷的帆 = 张力；流体的重心 = 动态平衡），不做纯装饰。
  2. 源域轮换：建筑（拱/穹顶）、织物与乐器（张力）、水利（潮与满）、天文（轨道与引力）。水果与球类已被物象系统用滥，正文比喻禁用。
  3. 声音签名：身体事件配声（闷响、布料、水声、心跳、呼吸）。声音同时服务沉浸与"被听见的暴露感"。

  ## 十三、禁止清单

  - 禁止抽象宣判（巨大/惊人/充满母性）替代具体后果
  - 禁止临床数值进正文——比较级与物象代之
  - 禁止身体状态原地踏步且无说明
  - 禁止连续三句同主题堆砌
  - 禁止复用既往轮次的比喻、句式、画面
  - 禁止态度凭空跳变——心理轨迹必须有事件支撑
  - 禁止旁观者秒懂或永久无知——认知只进不退
  - 禁止把孕肚写成静物——它每一段都得做点什么
  - 禁止非临产推进产程（破水/见红/宫口），严重外部刺激除外
  - 禁止孕中期后把腰身写得比胸臀窄