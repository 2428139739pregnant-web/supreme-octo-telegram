肚子类型: |-
  ## 变量：肚子形状（正前方体型）

  ### 描述

  - **定义**：从正前方视角观察孕肚的几何形态，聚焦横轴（左右最大宽度）与纵轴（上下最大高度）的比例，反映平面轮廓和与角色体型的协调性。形状类型为平行分类（椭圆型、水滴型、球型、鹅卵形），各自对应不同体型、胎位和妊娠阶段的特征
  - **区分**：与"挺翘程度"（侧面凸出角度和垂坠感）不同，肚子形状关注正前方二维投影的形状（横轴纵轴比），强调平面视觉美学
  - **视角**：从恋孕癖角度，形状影响视觉冲击和情感投射，暗示孕育状态、体型特质及吸引力，激发保护欲、性欲或迷恋感

  ### 量化指标

  - **横轴和纵轴长度比**：横轴（左右最大宽度）与纵轴（上下最大高度）的比例，定义形状的纵横分布
  - **与孕前腹部正面面积比**：孕肚正面投影面积与孕前腹部正面面积的比值（孕前腹部面积设为 1），反映体积变化
  - **轮廓特征**：边缘曲线的平滑度或尖锐度，影响视觉美感

  ### 形状类型及细化描述

  1. **椭圆型**
     - 横轴和纵轴长度比：约 1.2:1（横轴略宽于纵轴）
     - 与孕前腹部正面面积比：0.8-2.5（孕早期 0.8-1.2，孕中期 1.2-2.0，孕晚期 2.0-2.5）
     - 轮廓特征：边缘平滑，横向稍宽，呈柔和椭圆，视觉上均衡丰腴

  2. **水滴型**
     - 横轴和纵轴长度比：约 1:1.3（纵轴略长，下部更宽）
     - 与孕前腹部正面面积比：1.2-3.0（孕中期 1.2-2.0，孕晚期 2.0-3.0）
     - 轮廓特征：上部平滑，下部宽大且略尖，呈水滴状，视觉上沉重

  3. **球型**
     - 横轴和纵轴长度比：约 1:1（横轴纵轴几乎相等）
     - 与孕前腹部正面面积比：1.5-3.5（孕中期 1.5-2.5，孕晚期 2.5-3.5）
     - 轮廓特征：边缘圆润，呈近乎正圆，整体均衡饱满

  4. **鹅卵形**

  > 注意：该条目后面需要给出肚子类型及成因（体型、体质、胎位、妊娠阶段、营养条件等），并融入恋孕癖视角和玩法偏好，适配设定，保持细腻精准的文风用一个诱人的长句串联起来。