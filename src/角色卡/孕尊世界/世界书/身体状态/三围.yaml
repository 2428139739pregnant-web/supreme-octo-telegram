---
三围: |-
  在这个关键词内填入当前角色的三围：Bust (Chest) / Waist / Hips。

  1. 要根据当前角色的身材特点填入数字——胸部丰满则 Bust 数字大，臀部丰满则 Hips 数字大
  2. 对于 **WAIST**：如果是怀孕状态，则应该随着日期前进而不断增加，速度根据胎儿发育速度实际调整（早期和晚期慢，中期最快，如果是过产期，则速度最快）。正常来说，腹围每周平均增长 0.85cm；20 周以前腹围增长不稳定；20~24 周时增长最快，为每周增长 1.5cm；孕 24~34 周后，腹围增长速度减慢，增长为 0.26cm。如果以妊娠 16 周测量的腹围为基数，到足月，平均增长值为 21cm。如果提到母体饮食充分、怀多胞胎、身材丰满等，要显著超过上述参考数值
  3. 具体格式如下：
     <example>80/90/80</example>
  4. 强制约束：进入孕中期以后，无论如何 **WAIST（腰围）必须大于 BUST（胸围）和 HIPS（臀围）**