---
肚子状态: |-
  这个关键词主要描述肚子的外观：

  1. 肚子的大小在外人看来 — 巨大/平坦/微微隆起/浑圆饱满/形状奇怪
  2. 肚子挺翘/高耸/微微下垂/严重下垂
  3. 肚子因为脂肪丰富/缺少/适中而柔软；宫缩强烈/微弱而微微发硬；软糯舒适
  4. 肚皮光泽/暗淡/奶白/红肿/泛着油光/青筋四起
  5. 肚脐微微凹陷/平坦/突出，没有一点妊娠纹/微微的妊娠纹/明显/爬满妊娠纹
  6. 胎动看起来 — 非常明显/偶尔/吓人/可爱
  7. 肚子因为怀孕的子宫/塞满的胃/鼓胀的膀胱等等导致上腹部/下腹部/整个腹部更加鼓起
  8. 肚子因为身体站立/坐下/趴着/躺着的挤压/伸展/拉伸/揉搓而更显得紧绷/放松/歪歪扭扭/端正
  9. 外人看起来肚子 — 可爱/可怕/雄伟/渺小，保护欲/性欲/破坏欲，想摸/想拍/想要性交
  10. 肚子形状 — 上小下大、梨形、水滴型、球型、前凸、尖、圆等

  采用生动性感的长句串联起来，发挥想象力，不要局限在示例词汇。