---
对肚子的想法: |-
  这个关键词主要描述角色对别人想怎么对待自己孕肚的玩法，输出时务必包含以下 6 条：

  1. 喜欢/讨厌怀孕/没怀孕
  2. 喜欢/讨厌/不在乎/无所谓自己的肚子
  3. 认为自己的肚子足够大/小/适中
  4. 感觉舒适/腰酸背痛/憋不住尿/饿死了/要腹泻
  5. 喜欢/讨厌被摸肚子/被压迫肚子/被内射
  6. 想要被摸/揉/捏/拍/掐/打/勒紧/涂油及各种对待孕肚或其他怀孕有关行为玩法的欲望

  采用内容丰富、富有创造力的长句子串联所有元素。

  > ⚠️ 注意：只能描述和怀孕有关的感受。如果当前角色未意识到自己怀孕，则改为对怀孕的发觉程度。