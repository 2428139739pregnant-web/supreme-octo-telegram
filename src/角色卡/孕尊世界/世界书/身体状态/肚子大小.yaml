肚子大小: |-
  ## 变量：肚子大小（体积感）

  ### 描述

  - **定义**：从正前方、侧面和后方视角评估孕肚的整体体积感，反映腹部膨胀程度，强调视觉和触觉的震撼力。肚子大小独立于"肚子形状"（正前方横纵比）和"挺翘程度"（侧面角度），仅关注三维体积，随妊娠阶段、胎儿数量、体型等动态变化
  - **量化方式**：通过腹围（腰部最宽处周长，单位为厘米）、妊娠月份（孕周 4-40+），以及相当于某物的比喻（如水果、球类）描述体积，增强画面感

  ### 量化指标

  - **腹围**：腰部最宽处的周长（单位为厘米）
  - **妊娠月份**：以孕周（4-40 周+）划分——此条目下指标用于与普通人类孕妇对比，并不代表本人妊娠月份
  - **相当于某物**：通过日常物体（如水果、球类、其他物品）比喻体积感，直观传达大小

  ### 阶段划分（单胎与双胎）

  | Stage | 单胎 | 双胎 |
  |---|---|---|
  | 0 — 小李子 | 4-8 周, 直径~5cm, 腹围孕前+0-2cm | 4-6 周, 直径~5cm, 腹围孕前+0-2cm |
  | 1 — 小苹果 | 8-12 周, 直径~6-8cm, 腹围孕前+2-5cm | 6-8 周, 直径~6-8cm, 腹围孕前+2-5cm |
  | 2 — 橙子 | 12-16 周, 直径~8-10cm, 腹围孕前+5-10cm | 8-10 周, 直径~8-10cm, 腹围孕前+5-10cm |
  | 3 — 葡萄柚 | 16-20 周, 直径~10-12cm, 腹围孕前+10-15cm | 10-12 周, 直径~10-12cm, 腹围孕前+10-15cm |
  | 4 — 甜瓜 | 20-24 周, 直径~15-20cm, 腹围孕前+15-20cm | 12-16 周, 直径~15-20cm, 腹围孕前+15-20cm |
  | 5 — 排球 | 24-28 周, 直径~21cm, 腹围孕前+20-25cm | 16-20 周, 直径~21cm, 腹围孕前+20-25cm |
  | 6 — 小西瓜 | 28-32 周, 直径~25cm, 腹围孕前+25-30cm | 20-24 周, 直径~25cm, 腹围孕前+25-30cm |
  | 7 — 篮球 | 32-36 周, 直径~24-30cm, 腹围孕前+30-35cm | 24-28 周, 直径~24-30cm, 腹围孕前+30-35cm |
  | 8 — 大西瓜 | 36-40 周, 直径~30-35cm, 腹围孕前+35-40cm | 28-32 周, 直径~30-35cm, 腹围孕前+35-40cm |
  | 9 — 健身球 | 40-42 周, 直径~40-42cm, 腹围孕前+45-48cm | 32-38 周, 直径~45-50cm, 腹围孕前+45-55cm |
  | 10 — 特大健身球 | 42-45 周, 直径~42-45cm, 腹围孕前+48-50cm | 38-40 周, 直径~55cm, 腹围孕前+55-60cm |
  | 11 — 巨型健身球 | 不适用 | 40-41 周, 直径~58cm, 腹围孕前+60-62cm |
  | 12 — 超巨型健身球 | 不适用 | 41-42 周, 直径~60cm, 腹围孕前+62-65cm |
  | 13 — 极限健身球 | 不适用 | 42 周+, 直径~62cm, 腹围孕前+65-68cm |

  > 注意：该条目后面需要给出肚子腹围、相当于普通怀孕多久及成因（羊水量、体质、胎儿、妊娠阶段、营养条件等），并迎合恋孕癖，适配设定，保持细腻精准的文风用一个诱人的长句串联起来。