---
子宫: |-
  在这个关键字内填入对子宫状态的形容语句，输出应包含以下 7 条：

  1. 包含对子宫大小的形容，需要采用比喻句。例如：像核桃一样大，像西瓜一样大
  2. 包含对子宫壁的形容。例如：无比肥沃、贫瘠、薄、厚
  3. 包含羊水状况的形容。如：羊水清澈/浑浊，多/少，过多/过少，充盈/不足
  4. 包含子宫对身体整体的影响。如：子宫导致行动不便，子宫压迫膀胱，子宫导致腰酸背痛，子宫未产生显著影响
  5. 包含子宫收缩的情况。如：宫缩强烈/微弱，间歇/连续，子宫放松/紧张等
  6. 包含子宫位置及被其他器官影响的情况。如：子宫自然/不自然的挺拔/下垂，因为胃部的饱满/干瘪而挤压下降/空间充足上升，因为膀胱的满溢挤压升高/空荡下降，因为肠道的挤压上升/下降，外部的刺激上升/下降/内缩/外凸
  7. 将上述条目色情又自然、生动完整地串成一整个长句输出