胎儿状态: |-
  输出以下七个要素：

  1. **大小**：几个体型 — 巨大/适中/偏小
  2. **物种**：人类/魔物宝宝
  3. **胎位**：胎位正/不正，头位/臀位/横位/纠缠在一起（这部分要详细描写，先描写胎位是那种类型，再描写胎儿具体姿势）
  4. **动作**：活泼好动/安安静静地在睡觉/踢打子宫/昏迷不醒
  5. **反应**：因为外界的某某刺激，子宫的收缩，而处于什么状态（被外物挤压，被击打等等）
  6. **胎儿心情**：好/特别好/差/特别差，饥饿/满足，喜欢待在里面/想要出去，活动空间充足/狭小
  7. **入盆**：还未入盆/开始入盆/完全入盆

  <information>
  随着怀孕周数的增加，到怀孕晚期孕妇往往感觉到腹部发紧或偶有腹痛，这是正常现象，是将胎头向下赶的力量，胎头逐渐下降。第一次生育，胎头入盆的时间一般在 36 周左右，占初产妇的 80%-90%，但仍有 10%-20% 要等到临产后才进入骨盆。经产妇往往都要到临产前后才进入骨盆。
  </information>

  <importance>用一个完整生动诱人的大长句串联起来，包含全部七条要素</importance>