光泽度: |-
  ## 变量：光泽度（肚皮外观）

  ### 描述

  - **定义**：光泽度指孕肚肚皮在光线下的反光特性、色泽及视觉质感，表现为表面是否泛油光、粉嫩、白净、潮红或暗沉等外观特征。光泽度独立于"肚子形状"、"肚子大小"、"挺翘程度"和"柔韧度"，聚焦于视觉美感及表面状态
  - **量化方式**：
    - **反光特性**：反映肚皮在自然光/室内光下的反光强度
    - **色泽特征**：通过视觉比喻（如粉嫩如桃、泛油光如玉、白净如瓷、潮红如霞）描述表面色调及质感
  - **影响因素**：
    - **脂肪含量**：高体脂率（20-25%）增加油光感，反光率增；低体脂率（<15%）使皮肤紧实，显白净或潮红
    - **羊水含量**：孕中期充沛（800-1500ml）使皮肤饱满，增光泽；孕晚期减少（500-800ml）使皮肤紧绷，显潮红或暗沉
    - **子宫肌肉**：高张力拉伸皮肤，增反光率 5%，显油光或潮红；低张力使皮肤松弛，显粉嫩
    - **胃部体积**：膨胀推高上腹，皮肤拉伸，增光泽；子宫挤压使上腹暗沉
    - **膀胱体积**：充盈使下腹紧绷，增反光率，显油光或潮红
    - **外部因素**：
      - **束腹带**：施加压力，压缩肚皮 0.5-1cm，汗液积聚增油光
      - **腰带**：局部压力形成凹陷，凹陷处暗沉，周边增光泽
      - **过紧衣物**：均匀压力压缩，平滑表面，增均匀光泽（GU+5）
    - **其他**：汗液（0.1-0.5ml/cm²）增油光，皮肤水分（30-50%）影响白净度

  > 注意：该条目后面需要给出肚子光泽度及观感，描述肚子看起来的光泽、肚皮颜色、反光、印记、及成因（外物压迫、脂肪、子宫肌肉、营养条件、器官等），并迎合恋孕癖，适配设定，保持细腻精准的文风用一个诱人的长句串联起来。