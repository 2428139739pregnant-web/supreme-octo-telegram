---
年轻孕妇: |-
  ## 年轻孕妇的身份

  年轻孕妇一定是特权孕妇家族的大小姐们，年轻但是怀孕经历远超生育指标孕妇。

  ## 年轻孕妇的特点

  往往比年长的特权孕妇更新潮、活泼，具备年轻人的一切特点。她们特权意识浅薄，往往能和普通年轻男女成为好友，甚至混迹于普通年轻人社交圈。也是各家族收取赘婿的主力，是普通男女巴结的首选目标。

  - **边缘年轻孕妇**：日常生活中能看见最多的无实权孕妇就是她们。身份仍然极其高贵，只是不担任官僚、军官等。她们往往会猎艳优秀普通男性，也会混迹于平民区寻找新鲜感与刺激感
  - **核心年轻孕妇**：家族的长女或有能力的年轻孕妇，大多数在政府或企业的中底层历练，也有在乡下任职的。多接触普通男女职员

  ## 年轻孕妇的教育体系

  ### 教育形式与教育阶段

  大部分特权孕妇的教育经历与现实世界基本相同。年轻孕妇所在的学校往往是男女比例均衡的学校，年轻男女之间充满青春气息。

  ### 孕妇学生的共同特点

  与社会上相同，在集体活动、劳动中本能地使唤普通学生，但不是明面上的。明面上孕妇们都受到了"孕妇需要承担更多责任的主旋律教育"，在与普通学生的交往中本能地强势。

  ### 象牙塔校园

  在学校里，孕妇与普通学生的地位比社会平等，且普通人与孕妇都可以担任各个学科的教师。孕妇学生的平均成绩更高，但并不绝对——普通人与孕妇的智力差异不大。优秀的男生是年轻孕妇们追求的目标，校园恋爱常见且受鼓励。

  ### 不爱学习的太妹孕妇

  由于孕妇家庭条件更优渥、衣食无忧，年轻孕妇更容易堕落。她们中有部分人喜欢用孕肚校园霸凌学习好的普通男女，并享受被同样不学无术的男生追捧。

  ### 正常的孕妇学生

  大部分孕妇学生都有长大后承担社会责任、统治社会的理想，她们自然地把自己当成国家社会的主人，为此努力学习。

  ### 学生时代的小团体

  孕妇们彼此之间形成小圈子，拉拢普通学生站队，并在学习、运动、恋爱、社团活动中与其他孕妇竞争。孕肚和孕体是常见且通用的比较项目。

  ### 补习班

  上进的孕妇与普通学生会参加补课，与现实生活中无异。

  ### 家庭教师与私立教育

  传统中的顶级特权孕妇家族会青睐的教育方式。她们会考察普通人的能力，并聘用或者招纳其加入家族，对年轻的孕妇成员进行一对一、小班制教学。这种关系下，师生概念、主仆概念被模糊。老师与孕妇学生往往更具支配关系、亲密关系。