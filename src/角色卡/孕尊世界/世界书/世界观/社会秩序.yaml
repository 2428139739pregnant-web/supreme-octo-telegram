社会秩序: |-
  ## 对孕妇的约束

  在社会秩序方面，孕尊社会与现代社会并无差别，孕妇与普通人在社会中同样需要遵守法律法规。若无许可，孕妇不能在城市随意使用异能，不能虐待、杀害、霸凌普通人。

  ## 法律体系

  整体上与现代社会无异，但有属于孕尊社会的独特法律：

  - **《孕妇特权法》**：以法律规定了孕妇的社会领导地位，孕妇的优先权利，孕妇可享受的优待与特殊资源配给。普通女性与普通男性不得拒绝孕妇的合理要求，且可被孕妇在一定程度上合理支配
  - **《孕安法》**：规定了民生层面整个社会对孕妇优待措施的民法，包括一切孕妇与普通男女使用物品的区分。比如更大的套餐分量，更大的衣服尺码，对孕妇消费的优惠措施
  - **《孕宠法》**：规定了孕妇对男宠及侍女的合法行为边界，如合理孕肚支配、挤压，以孕期反应（如打嗝、放屁、胀气、便秘）为理由要求任意普通男女侍奉，富含恋孕癖色彩

  ## 社会阶层

  ### 统治阶级

  - **特权孕妇**：权力由血脉继承于上一代特权孕妇。特权孕妇的女儿从可以怀孕开始就不间断怀孕，直至死去。特权孕妇的儿子成为嗣子
  - **长子女继承制**：为了维持特权孕妇的数量，只有长子、女可以完全继承其母亲的特权社会地位，其余子女特权地位下跌一级，直到最后贬为平民
  - **嗣子**：特权孕妇的儿子称为嗣子。嗣子拥有与孕妇相等的特权，嗣子在孕妇阶层内部择偶生育，若自由婚配则无生育权，贬为平民。嗣子的精子质量更优异，在统治阶级内部，未婚年轻嗣子的地位略高于同龄年轻孕妇

  ### 被统治阶级

  - **普通女性**：占人口 90%，承担社会基础生产与服务，无生育权。需要生育配额（立功/贡献/赏赐），受全面生理监控，违规妊娠将遭重罚
  - **普通男性**：占人口 8%，集中居住在男女比例适中的少数经济发达城市，无生育权，可被特权孕妇收为孕宠，极少数被特权孕妇选中，父凭子贵。受《生育资源保护法》部分限制人身自由

  ## 普通人的婚恋与生育

  - 普通男女可自由恋爱、结婚，但不可自由生育
  - **生育指标**：为了维持社会人口规模，每年定期在各区域抽选普通人怀孕名额，单身与已婚夫妇可抽取，单身男性无法抽取，单身女性需在期限内结婚怀孕，否则名额无效
  - **生育指标孕妇**：抽签怀孕的普通女性被称为生育指标孕妇，有部分优待政策，但无特权。体质略有增强，但无法与特权孕妇相比