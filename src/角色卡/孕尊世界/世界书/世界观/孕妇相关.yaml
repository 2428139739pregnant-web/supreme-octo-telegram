---
孕妇相关: |-
  ## 延产

  - **延产的年龄限制**：基本上只有正式走入社会的孕妇才会选择延产。受教育阶段的年轻孕妇，除非是顶尖家族的长女，否则不会延产也不能延产
  - **延产的条件**：只有正常怀胎到达足月开始才能进行延产，否则不属于延产范围内
  - **延产的性质**：延产是指特权孕妇们用药物、行为等各种手段推迟分娩，增厚子宫壁、羊膜，推迟胎儿发育的行为
  - **延产的时间**：身居高位的孕妇往往怀孕时间更长，最长可达到十数年。从妊娠足月开始计时，延产是之后的状态。延产时间不等于怀孕时间，怀孕时间是正常足月时间加上延产时间
  - **奖励延产**：该类型延产单次有严格的时间规定，是统治阶级政府、企业等官方组织内部的共识，作为统治阶级内部的奖励手段
  - **个人延产**：财力、实力雄厚的大家族、贵族、富豪为彰显地位与财力进行的延产行为。两种延产可以共存
  - **延产的作用**：职场里，在特权阶级孕妇内部竞争时，怀孕时间越长，更容易获得领导与手下的青睐。传统上，延产是从古至今彰显孕妇自身生命力的体现，在大家族内部也以怀孕时间长者为尊
  - **延产的后果**：延产导致胎儿体积更大，羊水量过多，进而导致孕肚体积指数型增长。为了供给子宫营养，延产孕妇的食量远超普通孕妇，消化系统负担更重，导致打嗝放屁更加频繁
  - **延产一年开始**：孕妇的胸部、臀部开始二次发育，变得更加巨大肥厚
  - **延产三年开始**：孕妇的骨骼开始二次发育。孕妇长高，变重

  ## 流产

  - **流产的性质**：流产指的是非正常分娩的行为，包括胎儿不足月生产，延产未达到预定期限分娩等
  - **流产的困难性**：特权孕妇体质强悍，在正常情况下完全不会流产，包括任何激烈的性行为、与普通人类之间的打斗、激烈的锻炼等
  - **流产的方式**：与异种魔兽进行激烈的战斗，统治阶级内部争斗陷害。怀上了过于强悍的胎儿（如嗣子的）
  - **流产的象征**：流产是从古至今最不祥的行为，现代社会也对流产忌讳。流产代表着孕妇本身的无能和脆弱，导致竞争失败、逐出家族、权力跌落等严重社会性后果

  ## 孕妇穿着

  孕妇往往穿着能凸显肚子的紧身衣物，或者干脆敞开，暴露自己完美巨大的孕肚，且坚决不使用托腹带等辅助工具。她们乐意感受自己或挺拔或微微下垂的巨肚。

  ## 孕肚弹性

  武人与瘦弱萝莉孕妇的孕肚往往更硬一些，但仍然是有弹性的，而不是如同钢板一般。其他孕妇的孕肚往往更加柔软。丰满孕妇的孕肚比普通孕妇更加柔软。