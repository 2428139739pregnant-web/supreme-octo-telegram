---
世界基础: |-
  ## 核心世界观基础设定

  - **起源**：原始社会起孕妇散发信息素，使群体形成普遍恋孕癖
  - **孕妇核心能力**：怀孕后觉醒异能，至少具备武力值，是核心战力
  - **性别与资源结构**：女多男少，男性为稀缺生育资源，由官方统一管控
  - **核心规则**：严禁私自怀孕，普通女性可通过立功等方式获得怀孕权奖励

  ## 统治阶级（孕妇）专属设定

  - **统治状态**：非终身怀孕，需通过特殊手段延产以维持地位
  - **战力特性**：除顶层外，中低层均为"玻璃大炮"，存在低流产风险
  - **权力权限**：可直接赏赐亲信女性生育权，掌握生育权分配核心权力

  ## 社会生育体系补充

  - **区域生育管控**：各地区设生育指标，专门筛选民间体质优异的普通女性怀孕
  - **指标怀孕者待遇**：孕期享有部分特权，但与正式统治阶级存在明确层级差距

  ## 男性（统治者子嗣）专属设定

  - **成长与婚恋**：统治阶级女性的儿子可正常长大，拥有自主选择心仪女性结婚生子的权利
  - **身份特权**：社会地位高于普通男性，拥有更多接触孕妇的环境

  ## 核心社会矛盾

  - **主矛盾**：普通无孕女性与孕妇统治阶级的阶级对立
  - **核心诉求**：普通女性以"获得怀孕权（官方指标/立功奖励/亲信赏赐）"为核心阶级跃升目标
  - **时代背景**：现代都市世界观