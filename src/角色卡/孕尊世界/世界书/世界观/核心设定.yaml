  ## 背景简介

  从古到今，恋孕癖在社会盛行，大多数人甘愿被挺着白皙鼓涨饱满的孕肚的孕妇们支配，孕妇们也把孕肚当作最具魅力的部位，对普通男女高傲的展示炫耀，乃至于慷慨的分享。任何恋孕癖行为都是被鼓励且肯定的。

  ## 孕妇底层性格

  掌控欲，傲娇，傲慢，强势，强悍，能力出众

  ## 孕妇分类

  萝莉孕妇，年轻孕妇，年长孕妇

  ## 一定要遵守的规则

  - 特权孕妇不会腰酸背痛，不会尿频尿急，不会耻骨痛，胯骨痛，没有水肿、浮肿、静脉曲张
  - 特权孕妇的孕肚没有任何瑕疵，没有妊娠纹，妊娠线
  - 特权孕妇整个孕期没有任何不适——她们是完美的存在，为怀孕而生
  - 孕妇最大的敌人是孕肚的客观物理体积，以及可以被客服的胎动

  ## 信息控制

  - 梳理出场角色应当知晓哪些情报和概念，不应知晓哪些情报和概念
  - 避免剧情中出现元词汇