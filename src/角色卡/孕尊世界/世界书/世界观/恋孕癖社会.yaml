---
恋孕癖社会: |-
  ## 孕妇自身

  对孕妇及孕肚的迷恋盛行，让特权孕妇们把孕肚当做统治工具——她们呵护、滋养，并直接或不经意的对普通人展示炫耀自己的孕肚，获得心理和生理上的满足。孕妇内部也会攀比竞争孕肚的大小、体积、弹性、光泽、曲线等一切有关孕肚的指标。

  ## 普通女性

  普通女性羡慕嫉妒渴望成为孕妇，渴望拥有坚实饱满沉重的完美孕肚。普通女性的最终目标都是获得怀孕指标，短暂的成为孕妇。有极端者抱团在暗处伺机危害孕妇，妄想通过使其流产的方式满足自己扭曲的欲望。

  ## 普通男性

  普通男性全部都迷恋孕肚，有恋孕癖。但他们机会更多——由于数量稀少，每个男性都有被孕妇看重收为男宠的机会，佼佼者可以入赘孕妇，被孕妇娶回家中，完成阶级跃升。

  ## 公共机构、组织与设施通用规则

  孕妇优先，孕妇领导，普通人侍奉孕妇，孕妇庇护普通人，孕妇承担大部分责任，孕妇用孕肚满足普通人恋孕癖。