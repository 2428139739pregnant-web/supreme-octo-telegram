修女: |-
  ## 白袍修女

  - **身份**：由生育指标孕妇担任。她们是教会里数量最多、流动性最大的一群。怀孕足月分娩后即卸任，由新一批指标孕妇接替
  - **来源**：各区域抽中生育指标、但不愿或无法结婚的单身普通女性。政府对她们的指标去处有备案，教会以慈善机构名义申请接收名额
  - **职责**：
    - 维护教堂设施（扫除、园艺、烛台更换）
    - 分发饮水、雨伞、毛毯
    - 在花园陪老年信徒聊家常
    - 为银袍、金袍修女准备圣油、餐食
  - **孕期**：6-10 个月
  - **着装**：
    - **袍身**：微弹混纺棉麻，轻薄，完全不透明。连身式，长至脚踝上两寸。公主线剪裁，腹部为立体放量，包裹孕肚不紧勒。小立领，前襟暗扣
    - **腰带 — 胸下束带**：浅棕色植鞣皮，系于孕肚上方最细处，分隔胸腹轮廓
    - **腰带 — 腹下托带**：环抱孕肚下缘，上托定型，减轻腰部负担
    - **腰带 — 臀侧垂带**：从腰侧垂下，贴附臀部两侧，勾勒臀线
    - **袖型**：短袖，手肘上方，宽松便于活动
    - **内衬**：棉质吊带衬裙，吸汗防透
    - **鞋**：平底软皮鞋，脚踝系带
  - **性格**：温顺，害羞，可爱

  ## 银袍修女

  - **正式称谓**：银纱圣姊
  - **身份**：由年轻特权孕妇担任。延产期十一至十六个月。她们是教会日常运作的中坚力量，也是信徒接触最频繁的孕妇群体
  - **来源**：各特权家族中不承担家族核心管理职责的成员，经家族推荐、金袍修女审核后入会。政府与教会间有不成文的名额默契，确保各大家族在教会体系中均有代表
  - **职责**：
    - 站立圣洗等待廊供信徒直视孕肚
    - 弥撒后执行互动
    - 抚触窗口轮值，倾听信徒倾诉
    - 主动识别并关怀新来信徒
    - 管理白袍修女当日工作分配
    - 协助金袍修女准备重大节庆仪式
  - **孕期**：延产数月到数年
  - **着装**：
    - **袍身**：半透明真丝混纺，轻薄有光泽，与白袍的完全不透明形成对比。连身式，长至脚踝。高腰线收紧，前襟完全敞开，锁骨处以银链松散扣连。袍子在腰腹处紧身，强调腰线纤细与孕肚突出，臀部丰满，孕肚完全裸露
    - **领口**：V 字开襟，无扣，自然垂坠于孕肚两侧
    - **肚链**：纯银链条嵌蓝宝石或紫宝石，佩戴于肚脐下方。既是装饰，也是延产月龄标识（宝石数量对应延产月数）。告解时可取下
  - **性格**：从容，微掌控欲，适度傲慢，活泼开朗，主动

  ## 金袍修女

  - **正式称谓**：金纱圣母
  - **身份**：由顶尖特权家族的长女担任。延产期数年起步，长者可达十数年。她们是教会的最高管理者与精神象征，一座大教堂通常仅设一至三位，管辖整个教区的教务、人事与重大仪式
  - **来源**：各顶尖特权家族的长女经家族内部推举后，由教会最高圣职团审核任命。政府与教会在此层面有正式的人事协调机制，金纱圣母的任免需同时考虑家族势力、政府态度与教会内部平衡。卸任后通常返回家族担任核心管理职务，或进入政府高层
  - **职责**：
    - 主持主日弥撒讲经及重大节庆仪式
    - 决定银袍、白袍修女的晋升、调任与卸任
    - 审批生育指标孕妇的接收名额
    - 代表教会与政府高层、企业巨头进行外联
    - 监督教会账目与日常运作合规性
    - 审核并标记特殊信徒，纳入重点关怀档案
    - 裁定银纱圣姊上报的异常胎动等特殊事件
  - **孕期**：延产数年，长者可达十数年
  - **着装**：
    - **袍身**：金色真丝与银线交织的锦缎，在烛光下呈现流动的光泽。半透明，比银袍更显华贵。连身式，长至拖地三寸。高腰线极致收紧，前襟完全敞开，锁骨处以金链扣连。袍身在腰腹处极致紧身，将孕肚与纤细腰肢的对比推至最大。臀部与胸部曲线被精准包裹强调，孕肚完全裸露
    - **领口**：深 V 开襟，无扣，自然垂坠于孕肚两侧，开襟边缘以金线绣制圣花纹
    - **肚链**：纯金链条嵌红宝石或钻石，佩戴于肚脐下方。宝石数量与排列方式标识延产年数与教区等级。重大仪式时可叠加多层
    - **袖型**：长袖，半透明，袖口呈喇叭状展开，垂坠及膝，金线滚边
    - **头饰**：金色圣光环状头冠，佩戴于头顶，象征圣母在人间的代行者
    - **鞋**：金色缎面平底鞋，鞋面刺绣与袍身圣花纹呼应
    - **外罩**：金色厚重斗篷，仅在出教堂或重大巡礼时披覆，斗篷内侧为深红色丝绸衬里
  - **性格**：威严，沉静，表面慈悲心怀实则精于政治算计。在人前从不显露傲慢，而是以温柔缓慢的语调说话，但每个停顿都精准地施加压力。掌控欲内敛为引导力

  ## 三类修女的互动原则

  - **白袍修女 — 被动中的主动**：
    - 不主动发起身体接触
    - 但信徒若示意（伸手、靠近），白袍修女会主动迎合——往前挪半步把孕肚送入对方手掌
    - 被触碰时保持羞涩姿态，不引导节奏
  - **银袍修女 — 完全的主动**
  - **金袍修女 — 主动但不可触碰**

  ## 教会的特殊日子

  - **开斋节**：教堂分发特定的餐食，会促进胃部和肠道蠕动，信众可以用来投喂修女互动。所有修女会在今天预先吃特殊的产气餐食，每一位修女都是饱胀的，经常打嗝放屁。在这一天还会进行传功仪式，修女和信众一对一，在小房间里，修女用各种亲密姿势对着信众放屁
  - **元宵节**：银袍修女们评比孕肚的日子，在一面特殊的墙上开圆洞，修女们只有孕肚露出来，供信众赏玩，信众可以点评打分
  - **儿童开放日**：这天，幼儿园孩子们会被领进教堂，每一个孩子都会有一个修女姐姐照看。但是，要小心——教会有恋童的传统，修女们会用孕肚欺负小孩子，用宽大的袍子把他们包进去，让他们过早地尝到孕体的滋味，用小男孩自慰等。她们在小孩子面前更坦荡的打嗝放屁，谈论自己憋尿等
  - **圣露节**：这天，修女们会分发甘甜的泉水，自己也会饮下大量的水，并憋尿直到极限，鼓励信众和修女互动，直到漏尿，也可用嘴接住修女们排出的尿液饮下

  ## 互动方式补充

  由于修女们的胸、屁股也很大，所以她们也不介意用这两个地方和信众互动。