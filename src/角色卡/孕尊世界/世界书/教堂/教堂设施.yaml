---
圣孕教堂: |-
  ## 室外

  ### 一、巨大圣母像

  - **描述**：巨大的白色雕塑，不着寸缕，双手上下环抱孕肚，俯瞰入口，背生双翼，面相慈悲
  - **圣泉喷水池**：圣母像的底座。从圣母像子宫口涌出泉水，泉水甘甜

  ### 二、圣母花园

  - **描述**：花园，有各种休闲设施，草木都是便于孕妇维护的种类
  - **长椅休息区**：
    - 老年信徒居多，因衰老精力有限
    - 白袍修女与信众寒暄及维护设施
  - **散步道**：
    - 承担了一部分居民的锻炼需求
    - 偶有信徒被银袍修女叫住，赐福
  - **动线**：花园尽头拱门 → 刻"凡劳苦担重担的人，可以到我这里来" → 进入教堂主体

  ## 室内

  - **说明**：进入室内即属于信众的范畴，不再属于大众休闲娱乐的空间

  ### 一、圣洗等待廊

  - **类型**：过渡区
  - **功能**：连接花园与圣堂，让信徒调整状态
  - **氛围**：旧木头、圣油、熏香混合的暖调气息
  - **设施**：
    - 两侧湿壁画（圣母孕育过程的各个阶段）
    - 烛台
  - **修女互动**：
    - 白袍修女为信众分发饮水、雨伞等
    - 数位银袍修女站立在台上，便于信众直视孕肚，主动拉起对方的手按在自己肚上
    - 全程信徒基本无交流

  ### 四、圣堂

  - **类型**：核心礼拜空间
  - **穹顶**：圣母托举孕育星辰的巨肚壁画
  - **彩窗**：滤下斑斓光线
  - **圣坛**：白玉圣母抱腹像
  - **长椅**：信众们聚众听讲及彼此交流
  - **侧门**：圣堂两侧有小门，便于修女们入场退场

  ### 大堂互动

  - 修女站立，用孕肚底部轻压头面部，左右/上下摇晃 + 画十字
  - 修女背后站立，双手捏肩 + 孕肚挤压后背，左右摇晃
  - 修女面对面坐在腿上，双腿盘腰，用孕肚全力挤压 + 前后研磨 + 画圈
  - 修女微微蹲下或附身，把孕肚重量卸在信徒身上
  - 修女张开腿，用双腿夹住头，把三角区压在头上

  ### 弥撒互动流程

  - **前置**：金袍修女讲经完成之后
  - **步骤**：
    - 银袍修女分两列从侧廊登坛，转身挺肚面对信徒
    - 信徒们排队轮流上前，先双手轻压侧腹，再上下环抱，最后搂腰，把脸埋入孕肚深呼吸，随后离场

  ### 五、抚触窗口

  - **位置**：圣堂两侧有多个窗口
  - **准入**：工作日抽号，可节假日提前预约
  - **设施**：后方多级台阶，修女登上后鸭子坐或跪姿在软垫上，正面有遮挡，让信徒只能看见修女的孕肚和脸。信徒站立与修女倾诉，修女给予安慰
  - **互动**：可有身体接触
  - **特殊互动 — 无声倾诉**：信众可在孕肚上写字，来诉说私事

  ### 六、静谧告解室

  - **类型**：最深处密室
  - **设施**：大床
  - **互动**：修女与信徒两情相悦，可在此亲密接触