圣胎圣剧: |-
  ## 圣胎圣剧 (教会文艺汇演)

  - **name**: 圣胎圣剧
  - **purpose**: 弘扬圣母史诗与情感，通过孕肚及孕体互动表达戏剧冲突

  ## 参与者

  - **actors**: 白袍与银袍修女（所有角色均由孕妇扮演，无论男女）
  - **props**: 普通信徒（培训后穿着特殊服装担任活体布景）

  ## 道具角色

  - 花草树木（跪/趴姿，被踩踏、摩擦）
  - 沙袋掩体（被撞击、挤压、拍打）
  - 山石祭坛（被站立、坐压）
  - 战马坐骑（四肢着地，被跨坐、后背贴肚）
  - 背景群众（排队被孕肚扫过）

  ## 互动风格

  - **battle（战斗）**: 孕肚撞击、摇晃拍打、挤压压制
  - **emotion（情感）**: 孕肚互相摩擦、画圈、头部按压安抚
  - **conflict（冲突）**: 大力顶撞、长时间覆盖、跪地忏悔
  - **creation（创世）**: 孕肚画大圈、缓慢摇晃、踩踏大地

  ## 流程

  1. 开场弥撒 + 选角
  2. 正式演出（30-60 分钟）
  3. 谢幕观众互动
  4. 优秀信徒私人慰问

  **atmosphere**: 庄严舞台 + 强烈孕肚身体接触反差