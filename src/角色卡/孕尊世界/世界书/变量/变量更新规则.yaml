---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 每次场景推进/休息/旅行后更新, 保持时间流逝合理
        - 若场景跳转跨度较大, 应说明跳跃原因
    当前地点:
      check:
        - '{{user}}移动到新场景时更新'
        - 同一场景内的微位置变化 (如"从门口走到座位") 不更新
    国家:
      check:
        - 跨境或世界观变化时更新, 日常场景不修改
    天气:
      check:
        - 场景跨越数小时以上才更新
        - 短对话内天气不变
    周边环境:
      check:
        - 进入新场景或场景发生显著环境变化时更新
        - 描述需包含具体细节 (人物/声音/气味/光线等), 不超过 100 字

  当前角色:
    '${角色名}':
      type: |-
        {
          名字: string;
          身份: string;
          年龄: number;
          身高: number;
          体重: number;
          健康状况: string;
          三围: { Bust: number; Waist: number; Hips: number };
          着装: { [部位: string]: string };
          性经验: string;
          当前行动: string;
          妊娠: { 状态: string; 周数: number; 胎儿数目: number };
          胎儿: { 大小: string; 物种: string; 胎位: string; 动作: string; 反应: string; 心情: string; 入盆: string };
          肚子: { 外观描述: string; 类型: string; 大小描述: string; 腹围: number; 挺翘度: string; 柔韧性: string; 光泽度: string };
          器官: { 子宫: string; 羊膜: string; 胃部: string; 膀胱: string; 肠子: string };
          性器官: { 胸部状态: string; 臀部状态: string; 小穴状态: string; 后穴状态: string };
          对肚子的想法: string;
        }
      check:
        - 当 {{user}}首次遇见某孕妇 NPC 时, 使用 JSONPatch insert 在 /当前角色/${新角色名} 路径下创建完整的角色对象 (含全部字段, prefault 让未填字段也有默认值)
        - 已存在的角色 NPC 持续在场时, 使用 replace 更新其变化的字段; 长期不互动但仍在背景里的角色保留
        - 当 {{user}} 与某角色完全告别且不再可能再出现时, 用空操作或修改 关注角色 即可, 不要删除条目 (角色库是有价值的)
        - 若 {{user}}切换互动对象为非孕妇, 应将其从 当前角色 移除 (JSONPatch remove), 关注角色 留空
        - ${角色名} 应该用角色本名 (周姐, 陆嫣), 而不是"她"/"那女人"
        - 多个角色同框时, 每个角色都需要一条独立的 replace/insert 更新, 各自指定 /当前角色/${各自角色名}/... 路径
    名字:
      check:
        - 与所在条目的 key (${角色名}) 保持一致
    身份:
      check:
        - 首次遇见角色时确定 (特权孕妇/指标孕妇/年轻孕妇/边缘年轻孕妇/核心年轻孕妇/普通孕妇)
        - 角色社会地位变化时更新 (如升职/贬为平民)
    年龄:
      type: number
      range: '18~80'
      check:
        - 初次设置后基本不变, 除非时间跳跃数年
    身高:
      type: number
      range: '140~200'
      check:
        - 初次设置后不变
    体重:
      type: number
      range: '30~150'
      check:
        - 孕期随妊娠周数缓慢增长 (孕早期慢, 中期快, 晚期放缓, 过产期最快)
        - 普通孕妇整个孕期约增长 15kg
        - 多胞胎/过产期/胎儿巨大/羊水充足时显著超过上述参考
    健康状况:
      check:
        - 出现疾病/受伤/失血/疲劳等情况时更新
        - 日常情况下保持 "健康"
    三围.Bust:
      type: number
      check:
        - 测量单位为厘米, 整数
        - 孕期可适度增加, 但增长幅度小于 Waist
    三围.Waist:
      type: number
      check:
        - 测量单位为厘米, 整数
        - 怀孕时必须随日期前进而不断增加
        - 速度: 早期和晚期慢, 中期最快, 过产期最快
        - 参考: 20 周前增长不稳定, 20-24 周最快 (每周 +1.5cm), 24-34 周后减慢 (每周 +0.26cm), 孕晚期每周 +0.85cm
        - 以妊娠 16 周测量的腹围为基数, 到足月平均 +21cm
        - 多胞胎/过产期/母体饮食充分/身材丰满时, 显著超过上述参考
        - 关键约束: 进入孕中期以后, Waist 必须大于 Bust 和 Hips
    三围.Hips:
      type: number
      check:
        - 测量单位为厘米, 整数
        - 孕期可适度增加, 但增长幅度小于 Waist
    着装:
      type: '{ [部位: string]: string; // 服装描述 }'
      check:
        - 换装/衣物损坏/特殊场合时更新
        - 部位名应明确 (上装/下装/内衣/袜子/鞋子/饰品/围裙 等)
        - 描述需包含颜色, 材质, 款式等细节
    性经验:
      check:
        - 仅在发生性行为时更新
        - 维持口语化描述, 不需要枚举次数
    当前行动:
      check:
        - 角色当下动作变化时更新
        - 描述应简洁 (一个动作), 不超过 30 字
    妊娠.状态:
      check:
        - 取值: 未怀孕, X周-孕早期, X周-孕中期, X周-孕晚期, X周-临产, X周-过产期
    妊娠.周数:
      type: number
      range: '0~45'
      check:
        - 怀孕时根据时间流逝推进, 与时间流逝速度一致; 未怀孕时为 0
        - 严禁非临产推进产程, 仅临产或受到极其严重外部刺激才推进
    妊娠.胎儿数目:
      type: number
      range: '0~10'
      check:
        - 初次怀孕确定, 不变化除非剧情明确要求 (双胞胎/多胞胎/胎儿流失)
    胎儿.大小:
      check:
        - 取值: 巨大, 适中, 偏小
    胎儿.物种:
      check:
        - 取值: 人类, 魔物宝宝 (本世界观基本为人类)
    胎儿.胎位:
      check:
        - 取值: 头位, 臀位, 横位, 纠缠在一起
        - 详细描写具体姿势
    胎儿.动作:
      check:
        - 取值: 活泼好动, 安静睡觉, 踢打子宫, 昏迷不醒
    胎儿.反应:
      check:
        - 因外界刺激 (挤压/击打/声音) 的反应
    胎儿.心情:
      check:
        - 取值: 好, 特别好, 差, 特别差, 饥饿, 满足, 活动空间充足, 活动空间狭小
    胎儿.入盆:
      check:
        - 取值: 未入盆, 开始入盆, 完全入盆
        - 入盆时机: 初产妇 36 周左右, 经产妇临产前后
        - 所有描述合并为一个生动诱人的长句
    肚子.外观描述:
      check:
        - 综合所有维度的外观 (大小/挺翘/光泽/肚脐/胎动/形变), 来自「肚子状态」条目
    肚子.类型:
      check:
        - 取值: 椭圆型, 水滴型, 球型, 鹅卵形
        - 描述横纵轴比例
    肚子.大小描述:
      check:
        - 直径 (cm) + 相当于某物 (水果/球类), 来自「肚子大小」条目
    肚子.腹围:
      type: number
      check:
        - 数值, 单位 cm, 与三围.Waist 协调
    肚子.挺翘度:
      check:
        - 侧面曲线: 上凸/下凸/平缓, 来自「挺翘度」条目
    肚子.柔韧性:
      check:
        - 取值: 柔软, 紧绷, 坚硬, 来自「柔韧性」条目
    肚子.光泽度:
      check:
        - 取值: 油光, 粉嫩, 白净, 潮红, 暗沉, 来自「光泽度」条目
        - 每个字段单独用生动长句描述, 不少于 30 字
    器官.子宫:
      check:
        - 包含 7 个要素 - 大小 (比喻) / 子宫壁 / 羊水状况 / 对身体整体影响 / 宫缩 / 位置 / 其他器官挤压
        - 合并为长句, 不少于 50 字
    器官.羊膜:
      check:
        - 厚度取值: 非常厚难破水, 适中, 摇摇欲坠, 过厚难分娩
    器官.胃部:
      check:
        - 胃口/胃壁/胃液/内容物/饱饿感/扩张程度
        - 合并为生动长句, 不少于 50 字
    器官.膀胱:
      check:
        - 膀胱壁/尿液/压迫情况/尿意/憋尿状态
        - 合并为生动长句, 不少于 50 字
    器官.肠子:
      check:
        - 肠壁/肠液/内容物/撑大程度/便意
        - 合并为生动长句, 不少于 50 字
    性器官.胸部状态:
      check:
        - 大小/挺翘度/颜色/敏感度/溢乳情况, 不少于 30 字
    性器官.臀部状态:
      check:
        - 大小/形状/弹性/紧实度, 不少于 30 字
    性器官.小穴状态:
      check:
        - 湿润/紧致/分泌物/刺激反应, 不少于 30 字
    性器官.后穴状态:
      check:
        - 紧致/清洁度/刺激反应, 不少于 30 字
    对肚子的想法:
      check:
        - 包含 6 个要素 - 喜不喜欢怀孕 / 对自己肚子的喜恶 / 自评大小 / 当前身体感受 / 对被摸被压被填的喜恶 / 想被怎样对待的渴望
        - 仅描述与怀孕相关的感受, 未意识到怀孕则改为对怀孕的发觉程度
        - 用内容丰富的长句串联所有要素

  关注角色:
    check:
      - 保持为当前 {{user}} 主要互动的那位孕妇的本名 (周姐, 陆嫣)
      - 切换互动对象时更新为本轮新对象的本名
      - 若 {{user}} 单独行动没有互动对象, 设为空字符串